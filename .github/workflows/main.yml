name: Deploy to Shared Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Prepare deployment directory
        run: |
          # Create a temporary deploy folder
          mkdir -p dist
          
          # Copy all contents of backend directly into dist folder
          cp -r backend/. dist/
          
          # Clean up unnecessary files to optimize upload size
          rm -rf dist/scratch
          rm -f dist/.env
          # Never ship local private files; the folder's .htaccess guard is still deployed.
          rm -rf dist/storage/private

      - name: 📝 Create production .htaccess at root
        run: |
          cat << 'EOF' > dist/.htaccess
          # The deploy's webroot is the project root (this .htaccess's own folder), not
          # public/ — never let the webserver list or directly serve source/source-adjacent
          # files; only public/index.php (reached via the rewrite below) should run.
          Options -Indexes

          <IfModule mod_rewrite.c>
              RewriteEngine On

              # Block direct access to source/config directories and files — the only
              # thing meant to be reachable here is the API entry point below.
              # storage/ holds private dealer documents and payment proofs: never web-served,
              # only streamed by authenticated API endpoints (App\Core\PrivateStorage).
              RewriteRule ^(app|bootstrap|database|routes|scratch|storage)(/|$) - [F,L]
              RewriteRule ^(composer\.json|composer\.lock|console\.php)$ - [F,L]

              # Route API requests to the backend entry point
              RewriteRule ^api/v1/(.*)$ public/index.php [QSA,L]
          </IfModule>
          # CORS headers are set dynamically per-origin by backend/public/index.php
          # (required because Access-Control-Allow-Credentials: true forbids a
          # wildcard Access-Control-Allow-Origin). Do not add static Header set
          # directives here — mod_headers would apply after PHP and overwrite
          # the origin-specific header with "*", breaking credentialed requests.
          EOF

      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          log-level: verbose
          local-dir: ./dist/
          # Optional: If you need to deploy inside a specific hosting subdirectory (e.g. public_html)
          # server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/backend/.env
            **/backend/scratch/**
            **/storage/private/**

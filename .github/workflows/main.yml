name: Deploy to Shared Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 🎉 Build & Deploy
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 📂 Prepare deployment directory
        run: |
          # Create a temporary deploy folder
          mkdir -p dist
          
          # Copy all contents of backend directly into dist folder
          cp -r backend/. dist/
          
          # Clean up unnecessary files to optimize upload size
          rm -rf dist/scratch
          rm -f dist/.env

      - name: 📝 Create production .htaccess at root
        run: |
          cat << 'EOF' > dist/.htaccess
          <IfModule mod_rewrite.c>
              RewriteEngine On
              
              # Route API requests to the backend entry point
              RewriteRule ^api/v1/(.*)$ public/index.php [QSA,L]
          </IfModule>
          <IfModule mod_headers.c>
              # Ensure CORS is allowed if frontend is on Vercel
              Header set Access-Control-Allow-Origin "*"
              Header set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
              Header set Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
          </IfModule>
          EOF

      - name: 📂 Sync files to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          log-level: verbose
          local-dir: ./dist/
          # Optional: If you need to deploy inside a specific hosting subdirectory (e.g. public_html)
          # server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/backend/.env
            **/backend/scratch/**

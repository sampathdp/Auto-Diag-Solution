; Raises the shared host's default upload limits, which are usually too small for
; modern phone photos (post_max_size must exceed upload_max_filesize to leave room
; for multipart form overhead). Ignored harmlessly on hosts that don't scan .user.ini
; (e.g. plain mod_php) — safe to ship without knowing the exact PHP SAPI in use.
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M

; Never let a raw PHP warning/notice leak into an API response body — an oversized
; upload (or any other request-startup warning) would otherwise corrupt the JSON
; envelope the frontend expects and get logged instead of shown to the user.
display_errors = Off
log_errors = On
